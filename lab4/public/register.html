<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Excellence Tuition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Excellence Tuition</a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home / Courses</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Student Registration</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter phone number">
                </div>
                <div class="form-group">
                    <label for="course">Select Course Plan</label>
                    <select id="course" name="course">
                        <option value="basic">Basic Plan ($50/mo)</option>
                        <option value="standard">Standard Plan ($120/mo)</option>
                        <option value="premium">Premium Plan ($200/mo)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create password">
                </div>
                <button type="submit" class="btn">Submit Registration</button>
            </form>
        </div>
    </main>
    
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Excellence Tuition Classes. All Rights Reserved.</p>
            <div class="social-media">
                <a href="https://facebook.com" target="_blank">Facebook</a> |
                <a href="https://twitter.com" target="_blank">Twitter</a> |
                <a href="https://instagram.com" target="_blank">Instagram</a> |
                <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

</body>
</html>
