<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Food Order Management</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    header { background: #d94b2b; color: white; padding: 24px 7%; }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }
    main { max-width: 1050px; margin: 28px auto; padding: 0 18px; }
    .card { background: white; padding: 22px; border-radius: 10px; margin-bottom: 22px; box-shadow: 0 2px 10px #00000012; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    input, select, button { padding: 11px; border: 1px solid #ccd2d8; border-radius: 6px; font-size: 15px; }
    button { background: #d94b2b; border: 0; color: white; cursor: pointer; }
    button:hover { background: #b93b20; }
    .secondary { background: #596579; }
    .danger { background: #b83232; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; border-bottom: 1px solid #e5e7eb; padding: 12px 8px; }
    th { background: #fff0eb; }
    #message { margin-top: 12px; font-weight: bold; }
    .hint { color: #667085; font-size: 14px; }
    @media (max-width: 650px) { .table-wrap { overflow-x: auto; } table { min-width: 700px; } }
  </style>
</head>
<body>
  <header>
    <h1>Online Food Order Management</h1>
    <p>Place, view, update and delete food orders</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Place a Food Order</h2>
      <form id="orderForm">
        <div class="form-grid">
          <input id="orderId" type="number" min="1" placeholder="Order ID" required>
          <input id="customerName" type="text" placeholder="Customer name" required>
          <input id="itemName" type="text" placeholder="Food item" required>
          <input id="quantity" type="number" min="1" placeholder="Quantity" required>
          <input id="totalAmount" type="number" min="0" step="0.01" placeholder="Total amount" required>
          <select id="status">
            <option>Pending</option>
            <option>Preparing</option>
            <option>Delivered</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="actions" style="margin-top:14px">
          <button type="submit" id="submitButton">Place Order</button>
          <button type="button" class="secondary" id="cancelEdit" hidden>Cancel Edit</button>
          <button type="button" class="secondary" id="refreshButton">Refresh Orders</button>
        </div>
      </form>
      <p id="message" role="status"></p>
      <p class="hint">The REST API runs on port 4000. Data is stored in a JavaScript array and resets when the server restarts.</p>
    </section>

    <section class="card">
      <h2>All Food Orders</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th><th>Customer</th><th>Food Item</th>
              <th>Quantity</th><th>Status</th><th>Total (₹)</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr><td colspan="7">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API = "http://localhost:4000/orders";
    const form = document.getElementById("orderForm");
    const message = document.getElementById("message");
    const table = document.getElementById("ordersTable");
    let editingId = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b83232" : "#167044";
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || "Request failed");
      return data;
    }

    async function loadOrders() {
      try {
        const orders = await request(API);
        table.innerHTML = "";
        if (!orders.length) {
          table.innerHTML = '<tr><td colspan="7">No orders found.</td></tr>';
          return;
        }

        orders.forEach(order => {
          const row = document.createElement("tr");
          [
            order.orderId, order.customerName, order.itemName,
            order.quantity, order.status, order.totalAmount
          ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          const actions = document.createElement("td");
          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.className = "secondary";
          edit.addEventListener("click", () => startEdit(order));

          const remove = document.createElement("button");
          remove.textContent = "Delete";
          remove.className = "danger";
          remove.style.marginLeft = "6px";
          remove.addEventListener("click", () => deleteOrder(order.orderId));

          actions.append(edit, remove);
          row.appendChild(actions);
          table.appendChild(row);
        });
      } catch (error) {
        table.innerHTML = '<tr><td colspan="7">Could not load orders. Make sure expressApp.js is running on port 4000.</td></tr>';
        showMessage(error.message, true);
      }
    }

    function startEdit(order) {
      editingId = order.orderId;
      document.getElementById("orderId").value = order.orderId;
      document.getElementById("orderId").disabled = true;
      document.getElementById("customerName").value = order.customerName;
      document.getElementById("itemName").value = order.itemName;
      document.getElementById("quantity").value = order.quantity;
      document.getElementById("totalAmount").value = order.totalAmount;
      document.getElementById("status").value = order.status;
      document.getElementById("formTitle").textContent = "Update Food Order";
      document.getElementById("submitButton").textContent = "Update Order";
      document.getElementById("cancelEdit").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById("orderId").disabled = false;
      document.getElementById("formTitle").textContent = "Place a Food Order";
      document.getElementById("submitButton").textContent = "Place Order";
      document.getElementById("cancelEdit").hidden = true;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const order = {
        orderId: Number(document.getElementById("orderId").value),
        customerName: document.getElementById("customerName").value.trim(),
        itemName: document.getElementById("itemName").value.trim(),
        quantity: Number(document.getElementById("quantity").value),
        status: document.getElementById("status").value,
        totalAmount: Number(document.getElementById("totalAmount").value)
      };

      try {
        if (editingId !== null) {
          const { orderId, ...updates } = order;
          const result = await request(`${API}/${editingId}`, {
            method: "PUT", body: JSON.stringify(updates)
          });
          showMessage(result.message);
        } else {
          const result = await request(API, {
            method: "POST", body: JSON.stringify(order)
          });
          showMessage(result.message);
        }
        resetForm();
        await loadOrders();
      } catch (error) {
        showMessage(error.message, true);
      }
    });

    async function deleteOrder(id) {
      if (!confirm(`Delete order ${id}?`)) return;
      try {
        const result = await request(`${API}/${id}`, { method: "DELETE" });
        showMessage(result.message);
        await loadOrders();
      } catch (error) {
        showMessage(error.message, true);
      }
    }

    document.getElementById("cancelEdit").addEventListener("click", resetForm);
    document.getElementById("refreshButton").addEventListener("click", loadOrders);
    loadOrders();
  </script>
</body>
</html>
